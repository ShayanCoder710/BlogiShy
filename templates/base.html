<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}BlogiShy{% endblock %}</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/icon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/inkflow.css', v='15') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v='15') }}">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ url_for('home') }}">
    <img src="{{ url_for('static', filename='images/icon.png') }}" alt="logo">
    <span>BlogiShy</span>
  </a>
  <button class="nav-toggle" type="button" aria-label="باز و بسته کردن منو" aria-expanded="false" aria-controls="site-nav">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <nav class="site-nav" id="site-nav">
    <a href="{{ url_for('home') }}">خانه</a>
    {% if current_user %}
      <a href="{{ url_for('write') }}">نوشتن بلاگ</a>
      <a href="{{ url_for('profile') }}">بلاگ‌های من</a>
      <a href="{{ url_for('settings') }}">تنظیمات</a>
      <a href="{{ url_for('logout') }}">خروج</a>
    {% else %}
      <a href="{{ url_for('register') }}">ثبت نام</a>
      <a href="{{ url_for('login') }}">ورود</a>
    {% endif %}
  </nav>
</header>

<main class="site-main">
  {% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
<script type="module">
import { Eggy } from "{{ url_for('static', filename='js/eggy.js', v='15') }}";
const toasts = [
{% with messages = get_flashed_messages(with_categories=true) %}
{% for cat, msg in messages %}
{ type: {{ ("error" if cat == "error" else "info")|tojson }}, message: {{ msg|tojson }} },
{% endfor %}
{% endwith %}
];
for (const t of toasts) {
  Eggy({
    type: t.type,
    title: "",
    message: t.message,
    position: "top-right",
    duration: 5000,
    styles: true,
    progressBar: true,
  });
}
</script>
<script>
(function () {
  var btn = document.querySelector(".nav-toggle");
  var nav = document.getElementById("site-nav");
  if (!btn || !nav) return;
  btn.addEventListener("click", function (e) {
    e.stopPropagation();
    var open = nav.classList.toggle("open");
    btn.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.addEventListener("click", function (e) {
    if (!nav.classList.contains("open")) return;
    if (nav.contains(e.target) || btn.contains(e.target)) return;
    nav.classList.remove("open");
    btn.classList.remove("open");
    btn.setAttribute("aria-expanded", "false");
  });
  nav.addEventListener("click", function (e) {
    if (e.target.closest("a")) {
      nav.classList.remove("open");
      btn.classList.remove("open");
      btn.setAttribute("aria-expanded", "false");
    }
  });
  window.addEventListener("resize", function () {
    if (window.innerWidth > 720) {
      nav.classList.remove("open");
      btn.classList.remove("open");
      btn.setAttribute("aria-expanded", "false");
    }
  });
})();
</script>
</body>
</html>
