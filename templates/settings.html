{% extends "base.html" %}
{% block title %}تنظیمات &middot; BlogiShy{% endblock %}
{% block content %}
<h1 class="center">تنظیمات حساب</h1>
<div class="settings-grid">
  <div class="form-card">
    <h2>پروفایل</h2>
    <p class="muted">نام کاربری و اسم شما. اسم روی صفحه‌ی پروفایل و در کنار بلاگ‌ها نمایش داده می‌شود.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="which" value="profile">
      <div class="field">
        <label for="username">نام کاربری</label>
        <input type="text" id="username" name="username" required pattern="[\w\-]{3,30}" minlength="3" maxlength="30" value="{{ user.username }}" placeholder="مثلا: ali">
      </div>
      <div class="field">
        <label for="name">نام</label>
        <input type="text" id="name" name="name" maxlength="50" value="{{ user.name or '' }}" placeholder="نام">
      </div>
      <div class="field">
        <label for="last_name">نام خانوادگی</label>
        <input type="text" id="last_name" name="last_name" maxlength="50" value="{{ user.last_name or '' }}" placeholder="نام خانوادگی">
      </div>
      <button type="submit" class="btn btn-primary btn-block">ذخیره‌ی پروفایل</button>
    </form>
  </div>
  <div class="form-card">
    <h2>رمز عبور</h2>
    <p class="muted">رمز عبور فعلی را وارد کنید و یک رمز جدید انتخاب کنید.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="which" value="password">
      <div class="field">
        <label for="current">رمز عبور فعلی</label>
        <input type="password" id="current" name="current" required placeholder="رمز فعلی">
      </div>
      <div class="field">
        <label for="new">رمز عبور جدید</label>
        <input type="password" id="new" name="new" required minlength="6" placeholder="حداقل ۶ کاراکتر">
      </div>
      <div class="field">
        <label for="confirm">تکرار رمز جدید</label>
        <input type="password" id="confirm" name="confirm" required placeholder="رمز جدید را دوباره وارد کنید">
      </div>
      <button type="submit" class="btn btn-primary btn-block">تغییر رمز عبور</button>
    </form>
  </div>
</div>
{% endblock %}
